name: Deploy Demo

on:
  # Деплоим demo при каждом push в main
  push:
    branches:
      - main

  # Позволяет запустить workflow вручную из GitHub Actions
  workflow_dispatch:

permissions:
  # Доступ только на чтение содержимого репозитория
  contents: read

concurrency:
  # Не запускаем несколько деплоев Pages одновременно
  group: github-pages

  # Если появился новый push — отменяем предыдущий незавершённый деплой
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Клонируем репозиторий
      - name: Checkout
        uses: actions/checkout@v7

      # Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

          # Включаем кеш npm
          cache: npm

      # Получаем настройки GitHub Pages,
      # в том числе правильный base path для проекта
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Устанавливаем зависимости строго по package-lock.json
      - name: Install dependencies
        run: npm ci

      # Собираем demo.
      # base нужен, чтобы ассеты корректно работали по адресу:
      # https://<organization>.github.io/icons/
      - name: Build demo
        run: npm run build:demo -- --base="${{ steps.pages.outputs.base_path }}/"

      # Загружаем собранную папку demo как artifact для GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo

  deploy:
    # Деплой начинается только после успешной сборки
    needs: build

    runs-on: ubuntu-latest

    permissions:
      # Разрешение на публикацию GitHub Pages
      pages: write

      # Нужно для авторизации GitHub Pages через OIDC
      id-token: write

    environment:
      name: github-pages

      # GitHub покажет URL опубликованного сайта
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Публикуем загруженный artifact в GitHub Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5